<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Modelo 3D — País</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06151a;font-family:Arial,sans-serif}
  #info{position:fixed;left:18px;top:18px;z-index:5;color:white;background:rgba(4,16,20,.72);
    padding:12px 15px;border:1px solid rgba(255,255,255,.18);border-radius:14px;backdrop-filter:blur(8px)}
  #info b{display:block;font-size:16px;margin-bottom:4px}
  #info span{font-size:12px;opacity:.8}
  #loading{position:fixed;inset:0;display:grid;place-items:center;background:#06151a;color:white;z-index:20}
  #loading div{text-align:center}
  .bar{width:230px;height:7px;border-radius:9px;background:#17343a;overflow:hidden;margin-top:12px}
  #progress{height:100%;width:0;background:#6ed6c2}
  #hint{position:fixed;right:18px;bottom:18px;z-index:5;color:white;font-size:12px;
    background:rgba(4,16,20,.58);padding:9px 12px;border-radius:12px}
</style>
</head>
<body>
<div id="loading"><div><div>Carregando modelo 3D…</div><div class="bar"><div id="progress"></div></div></div></div>
<div id="info"><b>Exploração 3D</b><span>Arraste para girar • Scroll para aproximar</span></div>
<div id="hint">O modelo gira automaticamente</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06151a);
scene.fog = new THREE.FogExp2(0x06151a, 0.12);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.01, 100);
camera.position.set(1.45, 1.05, 1.75);

const renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xbfeeff, 0x10231d, 2.2));
const sun = new THREE.DirectionalLight(0xffe3b0, 3.2);
sun.position.set(2.5,4,2.5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
scene.add(sun);
const fill = new THREE.DirectionalLight(0x8fd9ff, 1.5);
fill.position.set(-3,1,-2);
scene.add(fill);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 0.55;
controls.maxDistance = 5;
controls.target.set(0,0,0);

const loading = document.querySelector('#loading');
const progress = document.querySelector('#progress');

function makeTree(x,z,s=1){
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(.012*s,.018*s,.10*s,8),
    new THREE.MeshStandardMaterial({color:0x69462b,roughness:1})
  );
  trunk.position.y=.0;
  trunk.castShadow=true;
  g.add(trunk);
  const crown = new THREE.Mesh(
    new THREE.DodecahedronGeometry(.055*s,1),
    new THREE.MeshStandardMaterial({color:0x2d8a4d,roughness:.9})
  );
  crown.position.y=.075*s;
  crown.castShadow=true;
  g.add(crown);
  g.position.set(x,-.13,z);
  scene.add(g);
  return g;
}

// Vegetação decorativa ao redor do modelo.
[
  [-.58,-.55,1.1],[-.48,-.64,.8],[-.30,-.66,1.0],[.05,-.65,.85],
  [.36,-.60,1.0],[.57,-.48,.8],[-.62,-.20,.85],[.62,-.18,1.0],
  [-.62,.18,.9],[.60,.22,.85],[-.52,.52,1.0],[-.25,.62,.8],
  [.10,.64,1.0],[.40,.58,.85]
].forEach(v=>makeTree(...v));

// Água animada: uma superfície grande abaixo do cenário.
const waterGeo = new THREE.PlaneGeometry(5,5,80,80);
const waterMat = new THREE.ShaderMaterial({
  transparent:true,
  uniforms:{uTime:{value:0}},
  vertexShader:`
    uniform float uTime;
    varying vec2 vUv;
    void main(){
      vUv=uv;
      vec3 p=position;
      p.z += sin(p.x*4.0+uTime*1.3)*0.008;
      p.x += cos(p.y*5.0+uTime*1.1)*0.006;
      gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);
    }`,
  fragmentShader:`
    uniform float uTime;
    varying vec2 vUv;
    void main(){
      float w = 0.5 + 0.5*sin(vUv.x*35.0 + uTime*1.5);
      float a = 0.72 + 0.12*w;
      gl_FragColor=vec4(0.03,0.36,0.43,a);
    }`
});
const water = new THREE.Mesh(waterGeo,waterMat);
water.rotation.x=-Math.PI/2;
water.position.y=-.17;
water.receiveShadow=true;
scene.add(water);

// Pequenos brilhos/partículas para dar vida ao ambiente.
const dots = new THREE.BufferGeometry();
const positions = [];
for(let i=0;i<180;i++){
  positions.push((Math.random()-.5)*3.8, .05+Math.random()*1.5, (Math.random()-.5)*3.8);
}
dots.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
const dotMat = new THREE.PointsMaterial({color:0xbfeee8,size:.008,transparent:true,opacity:.55});
scene.add(new THREE.Points(dots,dotMat));

const loader = new GLTFLoader();
loader.load('modelo.glb', gltf=>{
  const model = gltf.scene;
  model.traverse(o=>{
    if(o.isMesh){
      o.castShadow=true; o.receiveShadow=true;
      if(o.material){
        o.material.needsUpdate=true;
        if('roughness' in o.material) o.material.roughness=Math.min(o.material.roughness ?? .7,.82);
        if('metalness' in o.material) o.material.metalness=Math.min(o.material.metalness ?? 0,.35);
      }
    }
  });
  // O arquivo enviado já está centrado; mantemos a geometria original.
  scene.add(model);
  loading.remove();
}, xhr=>{
  if(xhr.total) progress.style.width=(xhr.loaded/xhr.total*100).toFixed(1)+'%';
}, err=>{
  console.error(err);
  loading.innerHTML='<div>Não foi possível carregar o modelo.<br>Verifique se o arquivo <b>modelo.glb</b> está na mesma pasta.</div>';
});

const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  waterMat.uniforms.uTime.value=t;
  dots.rotation.y=t*.012;
  controls.update();
  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
