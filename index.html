<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ilha Sulasia — Modelo 3D</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111d;font-family:Arial,sans-serif}
#viewer{width:100%;height:100%}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;color:white;background:#07111d;z-index:5}
#bar{width:min(360px,75vw);height:8px;background:#233244;border-radius:20px;overflow:hidden;margin-top:15px}
#progress{height:100%;width:0;background:#fff;transition:width .2s}
#msg{margin-top:12px;font-size:14px;opacity:.8}
#error{display:none;max-width:600px;padding:25px;text-align:center;line-height:1.5}
</style>
</head>
<body>
<div id="viewer"></div>
<div id="loading">
  <strong>Carregando Ilha Sulasia...</strong>
  <div id="bar"><div id="progress"></div></div>
  <div id="msg">0%</div>
  <div id="error"></div>
</div>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";
import {OrbitControls} from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js";
import {GLTFLoader} from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";

const loading=document.getElementById("loading");
const progress=document.getElementById("progress");
const msg=document.getElementById("msg");
const error=document.getElementById("error");

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x07111d);

const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.01,1000);
camera.position.set(1.8,1.25,2.1);

const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
document.getElementById("viewer").appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xbfdcff,0x183020,2.0));
const sun=new THREE.DirectionalLight(0xffffff,3.2);
sun.position.set(3,5,4); scene.add(sun);
const fill=new THREE.DirectionalLight(0x8ab8ff,1.2);
fill.position.set(-4,2,-3); scene.add(fill);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=.06;
controls.minDistance=.3;
controls.maxDistance=10;
controls.autoRotate=true;
controls.autoRotateSpeed=.7;

const loader=new GLTFLoader();
loader.load("./modelo.glb",gltf=>{
  const model=gltf.scene;
  scene.add(model);

  const box=new THREE.Box3().setFromObject(model);
  const size=box.getSize(new THREE.Vector3());
  const center=box.getCenter(new THREE.Vector3());
  model.position.sub(center);

  const maxDim=Math.max(size.x,size.y,size.z);
  const dist=maxDim/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2)));
  camera.position.set(dist*1.35,dist*.9,dist*1.35);
  camera.near=Math.max(maxDim/1000,.001);
  camera.far=maxDim*20;
  camera.updateProjectionMatrix();
  controls.target.set(0,0,0);
  controls.update();

  loading.style.display="none";
},xhr=>{
  if(xhr.total){
    const p=Math.round(xhr.loaded/xhr.total*100);
    progress.style.width=p+"%";
    msg.textContent=p+"%";
  }else{
    msg.textContent="Carregando...";
  }
},err=>{
  msg.style.display="none";
  progress.style.display="none";
  error.style.display="block";
  error.innerHTML="<strong>Não foi possível carregar o modelo.</strong><br><br>"+
    "Verifique se o arquivo <b>modelo.glb</b> está na mesma pasta do index.html no GitHub.";
  console.error(err);
});

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
